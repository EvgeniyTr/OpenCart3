# Local OpenCart 3.0.3.8 for testing the "Твои платежи" (YPMN) module.
#
#   docker compose up -d
#   open http://localhost and run the installer with:
#     DB host: db, user: opencart, password: opencart, database: opencart
#
# Or install without the browser (admin / admin):
#   docker compose exec opencart php install/cli_install.php install \
#     --db_hostname db --db_username opencart --db_password opencart \
#     --db_database opencart --db_driver mysqli --db_port 3306 \
#     --username admin --password admin --email admin@example.com \
#     --http_server http://localhost/
#
# Start over from scratch: docker compose down -v
#
# The module archive from ./dist is available inside the container at /plugin.

services:
  opencart:
    image: aamservices/opencart:3.0.3.8
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${OPENCART_PORT:-80}:80"
    volumes:
      # OpenCart code, config.php, uploaded images and installed extensions
      - opencart_html:/var/www/html
      - ./dist:/plugin:ro

  db:
    image: mariadb:10.6
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: opencart
      MARIADB_USER: opencart
      MARIADB_PASSWORD: opencart
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  opencart_html:
  db_data:
